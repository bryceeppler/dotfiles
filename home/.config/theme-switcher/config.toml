# The Surfaces that have to be named on this machine, and which two Themes are
# nominated as the Pairing. A Theme says what to show; this says where to put it.
# Only WezTerm needs naming: a running Neovim is found by its socket, not by a
# path configured here.

[wezterm]
config_file = "~/.config/wezterm/wezterm.lua"

# The Themes nominated as the starting halves, explicitly rather than inferred
# from the Themes on disk. They are read only when machine-local state has no
# halves to offer; from the first switch onward, each half is whatever was last
# adopted as it.
[pairing]
light = "catppuccin-latte"
dark  = "github-dark-default"
