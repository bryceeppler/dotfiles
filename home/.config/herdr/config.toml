onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "agent"],
]

[ui.sidebar.spaces]
row_gap = 1

[theme]
# Herdr is a Follower: the terminal theme takes its colors straight from the
# ANSI palette, so whatever `theme` puts on WezTerm is what Herdr wears.
name = "terminal"

auto_switch = false
[ui.toast]
delivery = "system"
