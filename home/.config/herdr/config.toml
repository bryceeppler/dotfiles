onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "agent"],
]

[ui.sidebar.spaces]
row_gap = 1

[theme]
# Herdr cannot express reverse-video active rows in its terminal theme.
# This pair supplies mode-aware row, cursor, and primary-text colors.
name = "nord"

auto_switch = true
dark_name = "nord"
light_name = "kanagawa-lotus"

[theme.custom]
# Every other token still inherits the host terminal palette.
accent = "blue"
panel_bg = "reset"
sidebar_bg = "reset"
surface0 = "reset"
surface1 = "reset"
surface_dim = "reset"
overlay0 = "reset"
overlay1 = "reset"
subtext0 = "reset"
mauve = "reset"
green = "green"
yellow = "yellow"
red = "lightred"
blue = "blue"
teal = "cyan"
peach = "yellow"

[ui.toast]
delivery = "system"
