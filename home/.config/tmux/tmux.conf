# tmux configuration
# Source of truth in ~/.dotfiles/home/.config/tmux; home-manager symlinks the
# dir to ~/.config/tmux.
# tmux is a Follower: every colour below comes from the terminal's ANSI
# palette, so re-theming the terminal re-themes this status bar with no edit
# to this file.
# Prefix is the default Ctrl-b (change to Ctrl-a below if you prefer).

# ── Colors / truecolor ─────────────────────────────────────────────────
# Make 24-bit colour pass through so Neovim's colorscheme looks right.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"

# ── Sensible defaults ──────────────────────────────────────────────────
set -g mouse on                 # click panes/windows, scroll, drag-resize
set -g history-limit 50000      # generous scrollback
set -sg escape-time 10          # don't lag the Esc key (helps Neovim)
set -g focus-events on          # let Neovim know when tmux focus changes
set -g base-index 1             # windows start at 1, not 0
setw -g pane-base-index 1       # panes start at 1 too
set -g renumber-windows on      # keep window numbers gapless
set -g set-clipboard on         # yank to the system clipboard
set -g display-time 2000        # show messages a bit longer
set -g status-interval 5        # refresh status bar every 5s

# Optional: uncomment these two lines to use Ctrl-a as the prefix instead.
# unbind C-b
# set -g prefix C-a

# ── Copy mode (vi-style, like Neovim) ──────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Friendlier keybindings ─────────────────────────────────────────────
# Reload config:            prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Split panes with | and - (and keep the current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps the current directory
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Status bar: follows the terminal palette ───────────────────────────
# No hex lives here. `default` is the terminal's own background and
# foreground, and colour0-15 are whatever its scheme defines for the ANSI
# palette, so re-theming the terminal re-themes this bar.
#
# Two rules keep it legible under any scheme rather than just the current one:
#
#   Muted text is `default,dim`, never a palette slot. Bright black is the
#   tempting choice and the wrong one: 687 of WezTerm's 1078 built-in schemes
#   put it under 3:1 contrast on their own background, and Solarized Dark sets
#   it to exactly the background, which would erase the date and the inactive
#   window names outright. `dim` degrades to plain text on a terminal that
#   ignores it, so the worst case is undimmed rather than invisible.
#
#   The pills are `reverse` rather than a literal foreground. Reverse paints
#   the text in the terminal's own background colour, which is the one colour
#   guaranteed to contrast with the pill under a light scheme and a dark one
#   alike; a hardcoded fg would be legible under only one of the two.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=default"

# Left: session name in an accent pill (ANSI blue)
set -g status-left "#[fg=colour4,bold,reverse] #S #[default] "
set -g status-left-length 40

# Windows: current one highlighted (ANSI green), the rest dimmed
set -g window-status-format "#[dim] #I:#W "
set -g window-status-current-format "#[fg=colour2,bold,reverse] #I:#W #[default]"
set -g window-status-separator ""

# Right: date + time
set -g status-right "#[dim] %a %d %b  #[fg=colour4,bold]%H:%M #[default]"
set -g status-right-length 40

# Panes + messages
set -g pane-border-style "fg=default,dim"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=default,fg=colour4,bold,reverse"
set -g mode-style "reverse"
