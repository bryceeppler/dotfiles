# GitHub Dark Default — WezTerm color scheme
# Exact palette from ~/dotfiles/iterm2/GitHub Dark Default.itermcolors,
# matching Neovim (github_dark_default) and iTerm2.
# Auto-loaded by WezTerm from ~/.config/wezterm/colors/ and selected via
# `config.color_scheme = 'GitHub Dark Default'` in wezterm.lua.

[metadata]
name = "GitHub Dark Default"
author = "GitHub (via github-vscode-theme)"

[colors]
foreground = "#e6edf3"
background = "#0d1117"
cursor_bg = "#e6edf3"
cursor_fg = "#0d1117"
cursor_border = "#e6edf3"
selection_bg = "#264f78"
selection_fg = "#e6edf3"
ansi = ["#484f58", "#ff7b72", "#3fb950", "#d29922", "#58a6ff", "#bc8cff", "#39c5cf", "#b1bac4"]
brights = ["#6e7681", "#ffa198", "#56d364", "#e3b341", "#79c0ff", "#d2a8ff", "#56d4dd", "#ffffff"]
