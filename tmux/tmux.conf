# tmux configuration
# Source of truth in ~/dotfiles, symlinked to ~/.config/tmux/tmux.conf
# Theme: GitHub Dark Default (matches WezTerm + Neovim)
# Prefix is the default Ctrl-b (change to Ctrl-a below if you prefer).

# ── Colors / truecolor ─────────────────────────────────────────────────
# Make 24-bit colour pass through so Neovim's github_dark_default looks right.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"

# ── Sensible defaults ──────────────────────────────────────────────────
set -g mouse on                 # click panes/windows, scroll, drag-resize
set -g history-limit 50000      # generous scrollback
set -sg escape-time 10          # don't lag the Esc key (helps Neovim)
set -g focus-events on          # let Neovim know when tmux focus changes
set -g base-index 1             # windows start at 1, not 0
setw -g pane-base-index 1       # panes start at 1 too
set -g renumber-windows on      # keep window numbers gapless
set -g set-clipboard on         # yank to the system clipboard
set -g display-time 2000        # show messages a bit longer
set -g status-interval 5        # refresh status bar every 5s

# Optional: uncomment these two lines to use Ctrl-a as the prefix instead.
# unbind C-b
# set -g prefix C-a

# ── Copy mode (vi-style, like Neovim) ──────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Friendlier keybindings ─────────────────────────────────────────────
# Reload config:            prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Split panes with | and - (and keep the current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps the current directory
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Status bar: GitHub Dark Default ────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0d1117,fg=#8b949e"

# Left: session name in a blue pill
set -g status-left "#[fg=#0d1117,bg=#58a6ff,bold] #S #[fg=#58a6ff,bg=#0d1117]#[default] "
set -g status-left-length 40

# Windows: current one highlighted green
set -g window-status-format "#[fg=#8b949e] #I:#W "
set -g window-status-current-format "#[fg=#0d1117,bg=#3fb950,bold] #I:#W #[default]"
set -g window-status-separator ""

# Right: date + time
set -g status-right "#[fg=#8b949e] %a %d %b  #[fg=#58a6ff,bold]%H:%M #[default]"
set -g status-right-length 40

# Panes + messages
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"
set -g message-style "bg=#58a6ff,fg=#0d1117,bold"
set -g mode-style "bg=#264f78,fg=#e6edf3"
